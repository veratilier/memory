<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory · 自动召回试验</title>
<style>body{font:16px/1.7 system-ui;background:#eff3f7;color:#182c40;max-width:1100px;margin:40px auto;padding:0 20px}h1{font-weight:500}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;border:1px solid #d8e1ea;border-radius:16px;padding:24px}textarea,input,select,button{box-sizing:border-box;font:inherit;padding:9px;border:1px solid #b9cad9;border-radius:8px;margin:5px 0;width:100%}button{cursor:pointer;background:#254763;color:white}button:disabled{opacity:.5}small{color:#52667b}.card{border-top:1px solid #d8e1ea;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#status{min-height:26px}label{display:block}@media(max-width:760px){main{grid-template-columns:1fr}}</style>
<h1>Memory / 自动召回试验</h1><p>写下一条带来源的记忆，再发消息。每次都会先检索，你可以查看真正交给模型的材料。</p>
<main><section><h2>记忆档案</h2><label>原文<textarea id="body" placeholder="输入一条测试记录" rows="3"></textarea></label><label>来源<input id="source" placeholder="例如：测试聊天第3条（虚构样本）"></label><label>类型<select id="kind"><option value="episode">经历</option><option value="preference">固定偏好</option><option value="agreement">共同约定</option><option value="reflection">感受（不进入事实召回）</option><option value="dream">梦（不进入事实召回）</option></select></label><button id="save">保存记录</button><button id="seed">加入虚构演示样本</button><div id="memories"></div></section>
<section><h2>试着聊一句</h2><small>没接模型也能检查检索和上下文；默认是关键词检索，配置嵌入模型后启用向量混合检索。</small><label>会话<input id="conversation" value="demo"></label><textarea id="message" rows="3" placeholder="试试：蓝色纸船放在哪里？然后问：那个呢？"></textarea><button id="search">发送并查看召回</button><button id="generate">发送并调用已配置模型</button><p id="status" role="status"></p><div id="reply"></div><div id="hits"></div><details><summary>查看交给模型的完整上下文</summary><pre id="payload"></pre></details></section></main>
<script>
const token='__TOKEN__', $=id=>document.getElementById(id);
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-Memory-Token':token},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function refresh(){const rows=await api('memories');$('memories').replaceChildren();for(const m of rows){const c=document.createElement('div');c.className='card';c.textContent=(m.active?'有效':'已被纠正')+' · '+m.kind+'\n'+m.body+'\n来源：'+m.source+'\n发生时间：'+(m.occurred_at||'未知');if(m.active){const b=document.createElement('button');b.textContent='纠正这条';b.onclick=()=>guard(async()=>{const body=prompt('填写完整修正内容',m.body);if(body===null)return;const source=prompt('更正依据/来源');if(!source)return;await api('memories',{body,source,kind:m.kind,supersedes:m.id});await refresh()});c.append(b)}$('memories').append(c)}}
async function guard(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){$('status').textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('save').onclick=()=>guard(async()=>{await api('memories',{body:$('body').value,source:$('source').value,kind:$('kind').value});$('body').value='';await refresh();$('status').textContent='记录已保存'});
$('seed').onclick=()=>guard(async()=>{for(const m of [{body:'【虚构测试】蓝色纸船放在书桌左边的木盒里。',kind:'episode',source_id:'demo-paperboat-v1'},{body:'【虚构测试】喜欢简短的中文回答。',kind:'preference',source_id:'demo-preference-v1'},{body:'【虚构测试梦境】蓝色纸船飞到了月亮上。',kind:'dream',source_id:'demo-dream-v1'}])await api('memories',{...m,source:'原型自带虚构样本，不是真实共同经历'});await refresh();$('status').textContent='已加入虚构样本'});
async function chat(generate){$('status').textContent='正在自动检索…';$('reply').textContent='';$('hits').replaceChildren();$('payload').textContent='';const r=await api('chat',{message:$('message').value,conversation:$('conversation').value,generate});$('status').textContent=r.retrieval.mode+' · 经历命中 '+r.retrieval.episode_hits+' 条 · '+r.status+(r.error?' · '+r.error:'')+' '+r.retrieval.warnings.join(' ');$('reply').textContent=r.reply||'尚未生成模型回复。';for(const m of r.retrieval.selected){const c=document.createElement('div');c.className='card';c.textContent=m.reason+' · '+m.body+'\n来源：'+m.source+'\nID：'+m.id;$('hits').append(c)}$('payload').textContent=JSON.stringify(r.messages,null,2)}
$('search').onclick=()=>guard(()=>chat(false));$('generate').onclick=()=>guard(()=>chat(true));guard(refresh);
</script></html>
